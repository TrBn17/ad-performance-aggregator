[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ad-performance-aggregator"
version = "1.0.0"
description = "Deterministic advertising campaign analytics"
requires-python = ">=3.12"
dependencies = ["polars==1.35.2"]

[project.optional-dependencies]
dev = ["pytest==9.0.1", "psutil==7.1.3", "ruff==0.14.6"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I"]

[project.scripts]
ad-aggregate = "ad_aggregator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ad_aggregator"]
